[project]
name = "ai-kb"
version = "0.7.0"
description = "AI 知识库 — 自动化技术情报收集与分析系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "xinhe-agent-tools>=0.1.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
markers = [
    "non_llm: deterministic tests with mocked or avoided LLM calls",
    "llm_e2e: real-provider end-to-end workflow verification",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["mcp_knowledge_server"]

[tool.setuptools.packages.find]
include = ["kb*", "ui*"]

[tool.setuptools.package-data]
ui = ["static/**/*"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.uv.sources]
xinhe-agent-tools = { path = "../../tools/agent-tools", editable = true }
