[project]
name = "ai-kb"
version = "0.7.0"
description = "Agentic Knowledge Bank — skills that turn a topic's materials into a provenance-tracked concept wiki"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "xinhe-agent-tools>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "non_llm: deterministic tests with mocked or avoided LLM calls",
    "llm_e2e: real-provider end-to-end workflow verification",
]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.uv.sources]
xinhe-agent-tools = { path = "../../../tools/agent-tools", editable = true }
